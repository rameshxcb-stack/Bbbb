name: Jharkhand District Notification Monitor

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jharkhand-district-notification-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load persistent monitor state
        id: load_state
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --heads origin monitor-state > /tmp/monitor-state-ref.txt

          if [ -s /tmp/monitor-state-ref.txt ]; then
            git fetch --no-tags origin monitor-state
            git show FETCH_HEAD:state.json > state.json
            test -s state.json
            echo "Loaded state from monitor-state branch"
          elif [ -f state.json ]; then
            echo "No monitor-state branch yet; migrating existing repository state.json"
          else
            echo "No prior state found; monitor will initialize a new state file"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notification monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFY_LANGUAGE: "both"
          OCR_ENABLED: "true"
          OCR_DPI: "150"
          OCR_MAX_WORKERS: "2"
          SEND_PDF_ENABLED: "true"
          GEMINI_MAX_OUTPUT_TOKENS: "16384"
          GEMINI_PDF_OCR_ENABLED: "true"
          STALE_NOTICE_DAYS: "10"
        run: |
          python monitor.py

      - name: Persist state in a single-commit branch
        if: ${{ always() && steps.load_state.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s state.json ]; then
            echo "::error::state.json is missing or empty; refusing to overwrite persistent state"
            exit 1
          fi

          python -m json.tool state.json >/dev/null || {
            echo "::error::state.json is invalid JSON; refusing to overwrite persistent state"
            exit 1
          }

          state_bytes=$(wc -c < state.json | tr -d ' ')

          if [ "$state_bytes" -gt 3100000 ]; then
            echo "::error::state.json exceeds the 3.1 MB persistence guard (${state_bytes} bytes); previous monitor-state branch will be preserved"
            exit 1
          fi

          echo "State size accepted: ${state_bytes} bytes"
          cp state.json /tmp/jharkhand-monitor-state.json

          # Discard local modifications to tracked files (state.json) since we
          # already backed up the updated content to /tmp. Without this, git
          # refuses to switch to the orphan branch because state.json has
          # uncommitted changes that would be overwritten.
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          git switch --orphan state-update
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/jharkhand-monitor-state.json state.json
          git add state.json

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update monitor state"

          pushed=false

          for i in 1 2 3; do
            if git push --force origin HEAD:monitor-state; then
              pushed=true
              echo "State push succeeded on attempt $i"
              break
            fi

            echo "State push attempt $i failed; retrying..."
            sleep 4
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not persist monitor-state after 3 attempts"
            exit 1
          fi
