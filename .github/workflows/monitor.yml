
name: Jharkhand District Notification Monitor

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jharkhand-district-notification-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Scan Jharkhand District Notices
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Load persistent monitor state
        id: load_state
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch --no-tags origin monitor-state
            git show FETCH_HEAD:state.json > state.json
            test -s state.json
            python -m json.tool state.json >/dev/null
            echo "Loaded existing state from monitor-state branch."
          else
            echo "monitor-state branch not found; checking repository state.json."

            if [ -f state.json ] && [ -s state.json ]; then
              python -m json.tool state.json >/dev/null
              echo "Using existing repository state.json."
            else
              echo "No previous state file found. Monitor will initialize it."
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for PDF OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory found; skipping regression tests."
          fi

      - name: Run notification monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          NOTIFY_LANGUAGE: "both"
          OCR_ENABLED: "true"
          OCR_LANG: "eng+hin"
          OCR_DPI: "150"
          OCR_MAX_WORKERS: "1"

          SEND_PDF_ENABLED: "true"
          GEMINI_MAX_OUTPUT_TOKENS: "16384"
          GEMINI_PDF_OCR_ENABLED: "true"
          STALE_NOTICE_DAYS: "10"
        run: |
          python monitor.py

      - name: Validate state file
        if: ${{ always() && steps.load_state.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s state.json ]; then
            echo "::error::state.json is missing or empty."
            exit 1
          fi

          python -m json.tool state.json >/dev/null

          state_bytes=$(wc -c < state.json | tr -d ' ')
          if [ "$state_bytes" -gt 3100000 ]; then
            echo "::error::state.json exceeds the 3.1 MB safety limit."
            exit 1
          fi

          echo "State file validated: ${state_bytes} bytes."

      - name: Persist state to monitor-state branch
        if: ${{ always() && steps.load_state.outcome == 'success' && hashFiles('state.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool state.json >/dev/null
          cp state.json /tmp/jharkhand-monitor-state.json

          git switch --orphan state-update
          git rm -rf . >/dev/null 2>&1 || true

          cp /tmp/jharkhand-monitor-state.json state.json
          python -m json.tool state.json >/dev/null

          git add state.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update monitor state"

          pushed=false

          for i in 1 2 3 4 5; do
            if git push origin HEAD:monitor-state; then
              pushed=true
              echo "State persisted successfully."
              break
            fi

            echo "State push attempt $i failed; retrying in 5 seconds."
            sleep 5
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not persist monitor state after 5 attempts."
            exit 1
          fi
